[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
description = "API Pooling System - Rust core proxy layer"

[lib]
name = "rust_core"
path = "src/lib.rs"

[[bin]]
name = "proxy-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"